<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Request a Service - MogotelT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 40px 20px; }
        .container { max-width: 550px; margin: auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h2 { color: #0f172a; margin-bottom: 5px; }
        .provider-name { color: #2ecc71; font-weight: bold; margin-bottom: 25px; }
        label { display: block; margin: 15px 0 5px; font-weight: 600; color: #333; font-size: 0.9rem; }
        input, textarea {
            width: 100%; padding: 12px; border: 1px solid #ddd;
            border-radius: 5px; box-sizing: border-box; font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: #2ecc71; }
        button {
            width: 100%; padding: 14px; background: #2ecc71; color: white;
            border: none; border-radius: 5px; font-weight: bold; cursor: pointer;
            font-size: 1rem; margin-top: 20px;
        }
        button:hover { background: #27ae60; }
        button:disabled { background: #ccc; }
        .msg { padding: 15px; border-radius: 5px; margin-top: 20px; text-align: center; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #2ecc71; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <h2>Request a Service</h2>
        <div class="provider-name" id="providerName">Loading provider...</div>

        <form id="requestForm">
            <input type="hidden" id="provider_id">
            <label>Your Name *</label>
            <input type="text" id="customer_name" required>

            <label>Your Phone Number *</label>
            <input type="tel" id="customer_phone" placeholder="0731234567" required>

            <label>Your Email (Optional)</label>
            <input type="email" id="customer_email">

            <label>Describe the job *</label>
            <textarea id="message" rows="4" placeholder="e.g. I need a leaking pipe fixed in my kitchen..." required></textarea>

            <button type="submit" id="submitBtn">Send Request</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        const API = 'http://localhost:3000/api';
        const params = new URLSearchParams(window.location.search);
        const providerId = params.get('provider_id');
        document.getElementById('provider_id').value = providerId;

        // Load provider info
        if (providerId) {
            fetch(`${API}/providers/${providerId}`)
                .then(r => r.json())
                .then(p => {
                    document.getElementById('providerName').textContent = 'To: ' + p.business_name;
                })
                .catch(() => {
                    document.getElementById('providerName').textContent = 'Provider not found';
                });
        }

        // Handle form
        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            const data = {
                provider_id: providerId,
                customer_name: document.getElementById('customer_name').value,
                customer_phone: document.getElementById('customer_phone').value,
                customer_email: document.getElementById('customer_email').value,
                message: document.getElementById('message').value
            };

            try {
                const res = await fetch(`${API}/requests`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (res.ok) {
                    msg.className = 'msg success';
                    msg.innerHTML = '✅ <b>Request sent!</b> The provider will contact you soon.';
                    document.getElementById('requestForm').reset();
                } else {
                    msg.className = 'msg error';
                    msg.textContent = '❌ ' + result.error;
                }
            } catch (err) {
                msg.className = 'msg error';
                msg.textContent = '❌ Server error. Please try again.';
            }

            btn.disabled = false;
            btn.textContent = 'Send Request';
        });
    </script>
</body>
</html>
